<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>知我境 · 像素开放世界</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-default/theme.css">
    <style>
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

    </style>
  </head>
  <body>
    <div id="login-root"></div>
    <div id="rpg" hidden></div>
    <div id="chat-root" hidden></div>
    <div id="landmark-root" hidden></div>
    <div id="interaction-hud" class="interaction-hud" hidden></div>
    <div id="contacts-root" hidden></div>
    <div id="top-right-hud" class="top-right-hud">
      <div id="autonomy-mode" class="autonomy-mode" role="status" aria-live="polite" hidden>
        <span class="autonomy-mode__dot" aria-hidden="true"></span>
        <span class="autonomy-mode__copy">
          <strong class="autonomy-mode__label"></strong>
          <small class="autonomy-mode__hint"></small>
        </span>
      </div>
    </div>
  </body>
</html>
